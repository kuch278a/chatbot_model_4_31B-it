# ==============================================================================
#  Amani AI — Enterprise Nginx Configuration
#  Roles: Reverse Proxy | Load Balancer | Content Cache | API Gateway
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. LOAD BALANCER & UPSTREAM POOL
# ------------------------------------------------------------------------------
# least_conn routes requests to the worker with the fewest active connections,
# optimal for LLM token generation where inference durations vary.
upstream amani_backend {
    least_conn;
    server 127.0.0.1:5000 max_fails=3 fail_timeout=10s;
    # Add additional worker backends or GPU instances here:
    # server 127.0.0.1:5001 max_fails=3 fail_timeout=10s;

    # Persistent keepalive connections to upstream workers
    keepalive 32;
}

# ------------------------------------------------------------------------------
# 2. CONTENT CACHING ZONES
# ------------------------------------------------------------------------------
# High-speed disk/memory cache for static files & cached TTS voice outputs
proxy_cache_path /var/cache/nginx/amani_cache
                 levels=1:2
                 keys_zone=AMANI_CACHE:10m
                 max_size=1g
                 inactive=60m
                 use_temp_path=off;

# ------------------------------------------------------------------------------
# 3. API GATEWAY: RATE LIMITING & SECURITY ZONES
# ------------------------------------------------------------------------------
# Limit concurrent connections per client IP
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# Limit inference requests to prevent GPU exhaustion / DoS
limit_req_zone $binary_remote_addr zone=chat_limit:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=api_general_limit:10m rate=30r/s;

# Custom status code for rate limiting
limit_req_status 429;
limit_conn_status 429;


# ==============================================================================
# 4. HTTP SERVER (Port 80) — Public Access & Gateway Routing
# ==============================================================================
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 196.188.240.106;

    # Security Headers (API Gateway)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Connection limit per IP
    limit_conn conn_limit 50;

    # Max upload size for multimodal audio/documents
    client_max_body_size 100M;
    client_body_buffer_size 128k;

    # --------------------------------------------------------------------------
    # GATEWAY ROUTE: Health & Readiness Check
    # --------------------------------------------------------------------------
    location /health {
        proxy_pass http://amani_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        access_log off;
    }

    # --------------------------------------------------------------------------
    # GATEWAY ROUTE: Interactive API Documentation (Swagger & OpenAPI)
    # --------------------------------------------------------------------------
    location ~* ^/API/(docs|openapi\.json) {
        proxy_pass http://amani_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --------------------------------------------------------------------------
    # REVERSE PROXY: Real-Time SSE Token Streaming (NO Buffering / NO Caching)
    # --------------------------------------------------------------------------
    location = /chat/stream {
        limit_req zone=chat_limit burst=10 nodelay;

        proxy_pass http://amani_backend;
        proxy_http_version 1.1;

        # Critical: streaming requires zero buffering and no caching
        proxy_buffering off;
        proxy_cache off;
        add_header X-Accel-Buffering no;

        # Long timeouts for intensive LLM generation
        proxy_connect_timeout 300s;
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        chunked_transfer_encoding on;
    }

    # --------------------------------------------------------------------------
    # CONTENT CACHE: Static Assets (CSS, Icons, Fonts)
    # --------------------------------------------------------------------------
    location ~* \.(css|js|ico|png|jpg|jpeg|svg|woff2?|ttf|eot)$ {
        proxy_pass http://amani_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        # Enable static caching
        proxy_cache AMANI_CACHE;
        proxy_cache_valid 200 304 24h;
        proxy_cache_valid 404 1m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header X-Cache-Status $upstream_cache_status;
        expires 1d;
    }

    # --------------------------------------------------------------------------
    # CONTENT CACHE: Text-to-Speech (TTS) Cached Audio Responses
    # --------------------------------------------------------------------------
    location /api/tts/audio {
        limit_req zone=api_general_limit burst=20 nodelay;

        proxy_pass http://amani_backend;
        proxy_http_version 1.1;

        # Cache synthesized audio to eliminate repeated TTS compute
        proxy_cache AMANI_CACHE;
        proxy_cache_methods GET;
        proxy_cache_valid 200 12h;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        add_header X-Cache-Status $upstream_cache_status;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --------------------------------------------------------------------------
    # DEFAULT PROXY: All other UI & API Endpoints
    # --------------------------------------------------------------------------
    location / {
        limit_req zone=api_general_limit burst=30 nodelay;

        proxy_pass http://amani_backend;
        proxy_http_version 1.1;

        # LLM streaming safety
        proxy_buffering off;
        proxy_cache off;
        add_header X-Accel-Buffering no;

        proxy_connect_timeout 300s;
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        chunked_transfer_encoding on;
    }
}


# ==============================================================================
# 5. HTTPS SERVER (Port 443) — TLS Termination & Gateway Routing
# ==============================================================================
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name 196.188.240.106;

    # TLS Certificates
    ssl_certificate     /etc/ssl/certs/amani.crt;
    ssl_certificate_key /etc/ssl/private/amani.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    limit_conn conn_limit 50;
    client_max_body_size 100M;
    client_body_buffer_size 128k;

    location /health {
        proxy_pass http://amani_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        access_log off;
    }

    location ~* ^/API/(docs|openapi\.json) {
        proxy_pass http://amani_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /chat/stream {
        limit_req zone=chat_limit burst=10 nodelay;

        proxy_pass http://amani_backend;
        proxy_http_version 1.1;

        proxy_buffering off;
        proxy_cache off;
        add_header X-Accel-Buffering no;

        proxy_connect_timeout 300s;
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        chunked_transfer_encoding on;
    }

    location ~* \.(css|js|ico|png|jpg|jpeg|svg|woff2?|ttf|eot)$ {
        proxy_pass http://amani_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        proxy_cache AMANI_CACHE;
        proxy_cache_valid 200 304 24h;
        proxy_cache_valid 404 1m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header X-Cache-Status $upstream_cache_status;
        expires 1d;
    }

    location /api/tts/audio {
        limit_req zone=api_general_limit burst=20 nodelay;

        proxy_pass http://amani_backend;
        proxy_http_version 1.1;

        proxy_cache AMANI_CACHE;
        proxy_cache_methods GET;
        proxy_cache_valid 200 12h;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        add_header X-Cache-Status $upstream_cache_status;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        limit_req zone=api_general_limit burst=30 nodelay;

        proxy_pass http://amani_backend;
        proxy_http_version 1.1;

        proxy_buffering off;
        proxy_cache off;
        add_header X-Accel-Buffering no;

        proxy_connect_timeout 300s;
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection        "";
        chunked_transfer_encoding on;
    }
}
