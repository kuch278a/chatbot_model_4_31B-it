# =============================================================
#  Amani AI — Public Nginx Reverse Proxy Configuration
# =============================================================

# Plain HTTP (Port 80) - Direct Public Access (No SSL warning)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 196.188.240.106;

    client_max_body_size 100M;

    location / {
        proxy_pass          http://127.0.0.1:5000;
        proxy_http_version  1.1;

        # Disable buffering for SSE streaming / Chatbot tokens
        proxy_buffering     off;
        proxy_cache         off;
        add_header          X-Accel-Buffering no;

        # Long timeout for model inference
        proxy_connect_timeout 300s;
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;

        # Headers
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;

        proxy_set_header    Connection        '';
        chunked_transfer_encoding on;
    }
}

# HTTPS (Port 443) - Secure Access
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name 196.188.240.106;

    ssl_certificate     /etc/ssl/certs/amani.crt;
    ssl_certificate_key /etc/ssl/private/amani.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 100M;

    location / {
        proxy_pass          http://127.0.0.1:5000;
        proxy_http_version  1.1;

        # Disable buffering for SSE streaming
        proxy_buffering     off;
        proxy_cache         off;
        add_header          X-Accel-Buffering no;

        proxy_connect_timeout 300s;
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;

        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto https;

        proxy_set_header    Connection        '';
        chunked_transfer_encoding on;
    }
}
