# =============================================================
#  Amani AI — Nginx HTTPS Reverse Proxy Config
#  Place this file at: /etc/nginx/sites-available/amani
#  Then: sudo ln -s /etc/nginx/sites-available/amani /etc/nginx/sites-enabled/
# =============================================================
#
#  IMPORTANT: Replace SERVER_IP_PLACEHOLDER with your actual
#  server machine IP (run: hostname -I to find it).
# =============================================================

# HTTPS server — proxies to Flask on port 5000
server {
    listen 443 ssl;
    server_name 196.188.240.106 10.100.9.209 _;

    ssl_certificate     /etc/ssl/certs/amani.crt;
    ssl_certificate_key /etc/ssl/private/amani.key;

    # Modern TLS only
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # -------------------------------------------------------
    # Critical: disable buffering for SSE token streaming
    # -------------------------------------------------------
    location / {
        proxy_pass          http://127.0.0.1:5000;
        proxy_http_version  1.1;

        # SSE / streaming — must be OFF
        proxy_buffering     off;
        proxy_cache         off;

        # Explicitly tell Nginx: do not buffer this response
        add_header          X-Accel-Buffering no;

        # Long timeout for model inference
        proxy_read_timeout  300s;
        proxy_send_timeout  300s;

        # Required headers
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto https;

        # Keep connection alive for streaming
        proxy_set_header    Connection        '';
        chunked_transfer_encoding on;
    }
}

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name 196.188.240.106 10.100.9.209 _;
    return 301 https://$host$request_uri;
}
