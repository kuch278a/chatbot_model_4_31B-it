<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Amani AI — Bilingual Amharic/English Conversational Assistant powered by Gemma 4 31B-it.">
    <title>Amani AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Inter:wght@400;500;600;700&family=Noto+Sans+Ethiopic:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/style.css?v=2.1">
    <script>
        (function () {
            const savedTheme = localStorage.getItem('amani_theme') || 'dark';
            if (savedTheme === 'light') {
                document.documentElement.setAttribute('data-theme', 'light');
            }
        })();
    </script>
</head>

<body>
    <!-- Mobile sidebar overlay -->
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

    <div class="app-container">
        <!-- ─── Collapsible Sidebar ───────────────────────────────────────────── -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-top">
                <div class="sidebar-brand-row">
                    <div class="brand-group">
                        <div class="brand-icon">አ</div>
                        <span class="brand-text">Amani AI</span>
                    </div>
                    <button class="icon-button" onclick="toggleSidebar()" title="Collapse menu">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                            <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z" />
                        </svg>
                    </button>
                </div>

                <button class="new-chat-pill" onclick="startNewChat()">
                    <svg viewBox="0 0 24 24">
                        <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z" />
                    </svg>
                    <span>New chat</span>
                </button>
            </div>

            <div class="sidebar-section-title">Recent</div>
            <div class="chat-history-list" id="chatList">
                <!-- Injected chat history items -->
            </div>

            <!-- Knowledge Base Drawer -->
            <div class="sidebar-kb-section">
                <div class="sidebar-kb-header">
                    <span>Knowledge Base (RAG)</span>
                    <button class="kb-refresh-btn" onclick="refreshFiles()" title="Rescan local documents">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                            <path
                                d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z" />
                        </svg>
                    </button>
                </div>
                <div class="kb-files-list" id="indexedFiles">
                    <div style="font-size:11px;color:var(--text-muted);text-align:center;padding:4px 0;">Loading
                        documents...</div>
                </div>
            </div>
        </aside>

        <!-- ─── Main Chat Viewport ───────────────────────────────────────────── -->
        <main class="main-chat-viewport">
            <!-- Top Bar -->
            <header class="gemini-topbar">
                <div class="topbar-left">
                    <button class="icon-button" id="menuToggle" onclick="toggleSidebar()" title="Toggle sidebar">
                        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
                            <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z" />
                        </svg>
                    </button>
                </div>

                <div class="topbar-right">
                    <!-- <select id="langSelect" class="pill-select" title="Language Selector">
                        <option value="am-ET" selected>አማርኛ (am-ET)</option>
                    </select>-->

                    <!-- Hands-Free / Auto-Listen Mode Toggle Button -->
                    <button id="autoListenBtn" type="button" onclick="toggleAutoListen()" class="action-pill-btn"
                        title="ቀጣይነት ያለው ውይይት / Hands-Free Voice Mode">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                            <path
                                d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5-3c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z" />
                        </svg>
                        <span id="autoListenText">Auto-Listen</span>
                    </button>

                    <!-- Theme Toggle Switch -->
                    <button id="themeToggleBtn" onclick="toggleTheme()" class="action-pill-btn"
                        title="Toggle Light / Dark Theme">
                        <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" width="16" height="16"
                            fill="currentColor">
                            <path
                                d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41l-1.06-1.06zm1.06-10.96c.39-.39.39-1.03 0-1.41s-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36c.39-.39.39-1.03 0-1.41s-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z" />
                        </svg>
                        <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" width="16" height="16"
                            fill="currentColor">
                            <path
                                d="M12.3 2a10 10 0 0 0-.19 20 10.04 10.04 0 0 0 9.89-8.49.75.75 0 0 0-.82-.86 8 8 0 0 1-8.88-8.88.75.75 0 0 0-.86-.82 10.15 10.15 0 0 0-.14-.95z" />
                        </svg>
                        <span class="theme-text">Dark</span>
                    </button>
                </div>
            </header>

            <!-- Chat Scroll Area -->
            <div class="chat-scroll-container" id="chatScrollContainer">
                <div class="conversation-inner" id="messages">
                    <div class="welcome-hero" id="welcomeHero">
                        <div class="welcome-badge-icon">አ</div>
                        <h1 class="welcome-title">ሰላም፣ እንዴት ልርዳዎት?</h1>
                    </div>
                </div>
            </div>

            <!-- ─── Floating Input Capsule ──────────────────────────────────── -->
            <div class="floating-input-wrapper">
                <div class="input-capsule-box">
                    <textarea id="userInput" class="gemini-textarea" placeholder="ሰላም፣ እንዴት ልርዳዎት? መልዕክትዎን እዚህ ይጻፉ..."
                        rows="1" onkeydown="handleKeyDown(event)" oninput="handleInput(this)"></textarea>

                    <div class="input-bottom-row">
                        <div class="input-tools-left">
                            <div class="rag-status-chip" title="Local RAG Semantic Search is active">
                                <svg viewBox="0 0 24 24" fill="currentColor">
                                    <path
                                        d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z" />
                                </svg>
                                <span>RAG Active</span>
                            </div>
                        </div>

                        <div class="input-actions-right">
                            <!-- Mic Button with Ethio-ASR Voice Recognition -->
                            <button type="button" id="micBtn" onclick="toggleSpeechRecognition()" class="gemini-mic-btn"
                                title="Click to record speech (English / Amharic)">
                                <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                                    <path
                                        d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5-3c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z" />
                                </svg>
                            </button>

                            <!-- Send Button with Dynamic Active Glow -->
                            <button type="button" id="sendBtn" onclick="sendMessage()" class="gemini-send-btn"
                                title="Send / ላክ" disabled>
                                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                                    <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" />
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>

                <div class="gemini-disclaimer-footer">
                    Amani AI may produce inaccurate information. Please verify important details.
                </div>
            </div>
        </main>
    </div>

    <!-- ─── Application JavaScript ───────────────────────────────────────────── -->
    <script>
        let messages = [];
        let chats = JSON.parse(localStorage.getItem('amani_chats') || '[]');
        let currentChatId = localStorage.getItem('amani_current_chat_id') || null;
        let isListening = false;
        let isStreaming = false;
        let autoListenMode = false;
        let ttsEnabled = true;
        let currentAudio = null;

        // ─── Initializer ───────────────────────────────────────────────────
        function init() {
            initTheme();
            if (!currentChatId || !chats.find(c => c.id === currentChatId)) {
                startNewChat(false);
            } else {
                loadChat(currentChatId);
            }
            renderChatList();
            loadFileList();
            initSpeechRecognition();

            if (window.speechSynthesis) {
                window.speechSynthesis.getVoices();
            }
        }

        // ─── Theme Switcher (Dark / Light) ──────────────────────────────────
        function initTheme() {
            const urlParams = new URLSearchParams(window.location.search);
            const themeParam = urlParams.get('theme');
            const savedTheme = themeParam || localStorage.getItem('amani_theme') || 'dark';
            setTheme(savedTheme);
        }

        function setTheme(theme) {
            const themeBtn = document.getElementById('themeToggleBtn');
            if (theme === 'light') {
                document.documentElement.setAttribute('data-theme', 'light');
                if (themeBtn) {
                    const text = themeBtn.querySelector('.theme-text');
                    if (text) text.textContent = 'Light';
                    themeBtn.title = 'Switch to Dark Theme';
                }
            } else {
                document.documentElement.removeAttribute('data-theme');
                if (themeBtn) {
                    const text = themeBtn.querySelector('.theme-text');
                    if (text) text.textContent = 'Dark';
                    themeBtn.title = 'Switch to Light Theme';
                }
            }
            localStorage.setItem('amani_theme', theme);
        }

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            setTheme(newTheme);
        }

        // ─── Sidebar Toggle ────────────────────────────────────────────────
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            if (window.innerWidth <= 768) {
                sidebar.classList.toggle('open');
                overlay.classList.toggle('active');
            } else {
                sidebar.classList.toggle('collapsed');
            }
        }

        // ─── Chat Management ───────────────────────────────────────────────
        function startNewChat(shouldConfirm = true) {
            if (shouldConfirm && messages.length > 0) {
                if (!confirm("አዲስ ውይይት መጀመር ይፈልጋሉ?")) return;
            }

            const newId = Date.now().toString();
            fetch('/clear', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ session_id: newId })
            }).catch(() => { });

            const newChat = {
                id: newId,
                title: 'New Chat',
                messages: [],
                timestamp: Date.now()
            };

            chats.unshift(newChat);
            currentChatId = newId;
            messages = [];

            saveToLocalStorage();
            renderChatList();
            displayMessages();
        }

        function loadChat(id) {
            const chat = chats.find(c => c.id === id);
            if (chat) {
                currentChatId = id;
                messages = chat.messages || [];
                displayMessages();
                renderChatList();
                saveToLocalStorage();

                if (window.innerWidth <= 768) {
                    document.getElementById('sidebar').classList.remove('open');
                    document.getElementById('sidebarOverlay').classList.remove('active');
                }
            }
        }

        function saveToLocalStorage() {
            const chat = chats.find(c => c.id === currentChatId);
            if (chat) {
                chat.messages = JSON.parse(JSON.stringify(messages));
                chat.timestamp = Date.now();
                if (chat.title === 'New Chat' && messages.length > 0) {
                    let firstMsg = messages[0].content;
                    if (firstMsg.length > 28) {
                        const truncated = firstMsg.substring(0, 28);
                        const lastSpace = truncated.lastIndexOf(' ');
                        chat.title = (lastSpace > 10 ? truncated.substring(0, lastSpace) : truncated) + '...';
                    } else {
                        chat.title = firstMsg;
                    }
                }
            }
            localStorage.setItem('amani_chats', JSON.stringify(chats));
            localStorage.setItem('amani_current_chat_id', currentChatId);
            renderChatList();
        }

        function renderChatList() {
            const list = document.getElementById('chatList');
            list.innerHTML = '';

            chats.forEach(chat => {
                const div = document.createElement('div');
                div.className = `chat-history-item ${chat.id === currentChatId ? 'active' : ''}`;
                div.onclick = () => loadChat(chat.id);

                div.innerHTML = `
                    <div class="chat-item-title-wrapper">
                        <svg viewBox="0 0 24 24" fill="currentColor">
                            <path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 9h12v2H6V9zm8 5H6v-2h8v2zm4-6H6V6h12v2z"/>
                        </svg>
                        <span class="chat-item-title-text">${escapeHtml(chat.title)}</span>
                    </div>
                    <button class="chat-item-delete" onclick="event.stopPropagation(); deleteChat('${chat.id}')" title="Delete chat">
                        <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor">
                            <path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/>
                        </svg>
                    </button>
                `;
                list.appendChild(div);
            });
        }

        function deleteChat(id) {
            if (!confirm("ይህንን ውይይት መሰረዝ እርግጠኛ ነዎት?")) return;

            fetch('/clear', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ session_id: id })
            }).catch(() => { });

            chats = chats.filter(c => c.id !== id);
            if (currentChatId === id) {
                if (chats.length > 0) {
                    loadChat(chats[0].id);
                } else {
                    startNewChat(false);
                }
            }
            saveToLocalStorage();
            renderChatList();
        }

        function deleteCurrentChat() {
            deleteChat(currentChatId);
        }

        // ─── Welcome Landing Hero ──────────────────────────────────────────
        function getWelcomeHtml() {
            return `
                <div class="welcome-hero" id="welcomeHero">
                    <div class="welcome-badge-icon">አ</div>
                    <h1 class="welcome-title">ሰላም፣ እንዴት ልርዳዎት?</h1>
                </div>
            `;
        }

        // ─── Display Messages ──────────────────────────────────────────────
        function displayMessages() {
            const container = document.getElementById('messages');
            container.innerHTML = '';

            if (messages.length === 0) {
                container.innerHTML = getWelcomeHtml();
                return;
            }

            messages.forEach(msg => {
                appendMessageNode(msg.role, msg.content, false, msg.sources);
            });

            scrollToBottom();
        }

        // ─── Input Handling ────────────────────────────────────────────────
        function handleKeyDown(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        function handleInput(el) {
            el.style.height = 'auto';
            el.style.height = Math.min(el.scrollHeight, 160) + 'px';

            const sendBtn = document.getElementById('sendBtn');
            if (el.value.trim().length > 0) {
                sendBtn.classList.add('active');
                sendBtn.disabled = false;
            } else {
                sendBtn.classList.remove('active');
                sendBtn.disabled = true;
            }
        }

        function scrollToBottom() {
            const scrollContainer = document.getElementById('chatScrollContainer');
            scrollContainer.scrollTop = scrollContainer.scrollHeight;
        }

        // ─── Typing Indicator ──────────────────────────────────────────────
        function showTypingIndicator() {
            const container = document.getElementById('messages');

            const indicator = document.createElement('div');
            indicator.className = 'message-row assistant';
            indicator.id = 'typingIndicator';
            indicator.innerHTML = `
                <div class="avatar-assistant">
                    <div class="avatar-badge">አ</div>
                </div>
                <div class="assistant-content-wrapper">
                    <div class="gemini-typing-indicator">
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                    </div>
                </div>
            `;
            container.appendChild(indicator);
            scrollToBottom();
        }

        function removeTypingIndicator() {
            const indicator = document.getElementById('typingIndicator');
            if (indicator) indicator.remove();
        }

        // ─── Markdown Parser ───────────────────────────────────────────────
        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return (text || '').replace(/[&<>"']/g, m => map[m]);
        }

        function renderMarkdown(text) {
            let html = escapeHtml(text);

            // Code blocks
            html = html.replace(/```([a-zA-Z0-9_-]*)\n([\s\S]*?)```/g, (match, lang, code) => {
                return `<pre><code class="language-${lang}">${code}</code></pre>`;
            });

            // Inline code
            html = html.replace(/`([^`]+)`/g, '<code>$1</code>');

            // Bold & Italics
            html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
            html = html.replace(/\*([^*]+)\*/g, '<em>$1</em>');

            // Unordered list items
            html = html.replace(/^[\-\*]\s+(.+)$/gm, '<li>$1</li>');
            html = html.replace(/((?:<li>.*<\/li>\n?)+)/g, '<ul>$1</ul>');

            // Ordered list items
            html = html.replace(/^\d+\.\s+(.+)$/gm, '<li>$1</li>');
            html = html.replace(/((?:<li>.*<\/li>\n?)+)/g, function (match) {
                if (match.startsWith('<ul>')) return match;
                return '<ol>' + match + '</ol>';
            });

            // Paragraphs and Line breaks
            html = html.replace(/\n\n+/g, '</p><p>');
            html = html.replace(/\n/g, '<br>');
            html = '<p>' + html + '</p>';
            html = html.replace(/<p>\s*<\/p>/g, '');

            return html;
        }

        // ─── Message Node Creation ─────────────────────────────────────────
        function appendMessageNode(role, content, scroll = true, sources = null) {
            const container = document.getElementById('messages');
            const welcomeHero = document.getElementById('welcomeHero');
            if (welcomeHero) {
                welcomeHero.remove();
            }

            const row = document.createElement('div');
            row.className = `message-row ${role}`;

            if (role === 'user') {
                row.innerHTML = `
                    <div class="user-bubble">${escapeHtml(content)}</div>
                `;
            } else {
                let sourcesHtml = '';
                if (sources && sources.length > 0) {
                    let chunkItems = sources.map(s => `
                        <div class="source-chunk-card">
                            <strong>${escapeHtml(s.document_name)}</strong> (Match: ${(s.score * 100).toFixed(1)}%)<br>
                            ${escapeHtml(s.text)}
                        </div>
                    `).join('');

                    sourcesHtml = `
                        <div class="sources-pill-accordion">
                            <div class="sources-pill-toggle" onclick="this.nextElementSibling.classList.toggle('open')">
                                <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H8V4h12v12z"/></svg>
                                <span>📚 ${sources.length} Retrieved Source(s)</span>
                            </div>
                            <div class="sources-body">${chunkItems}</div>
                        </div>
                    `;
                }

                row.innerHTML = `
                    <div class="avatar-assistant">
                        <div class="avatar-badge">አ</div>
                    </div>
                    <div class="assistant-content-wrapper">
                        <div class="assistant-bubble">${renderMarkdown(content)}</div>
                        ${sourcesHtml}
                        <div class="message-actions-toolbar">
                            <button class="action-icon-btn" onclick="copyMessageText(this)" title="Copy to clipboard">
                                <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
                            </button>
                            <!-- Read Aloud (TTS) Voice Button (Commented out)
                            <button class="action-icon-btn" onclick="speakSingleMessage(this)" title="Read Aloud (TTS)">
                                <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                            </button>
                            -->
                        </div>
                    </div>
                `;
            }

            container.appendChild(row);
            if (scroll) scrollToBottom();
            return row;
        }

        function copyMessageText(btn) {
            const wrapper = btn.closest('.assistant-content-wrapper');
            const bubble = wrapper.querySelector('.assistant-bubble');
            const text = bubble.innerText;

            navigator.clipboard.writeText(text).then(() => {
                const originalHtml = btn.innerHTML;
                btn.innerHTML = `<span style="font-size:11px;color:var(--gemini-emerald);">✓ Copied</span>`;
                setTimeout(() => { btn.innerHTML = originalHtml; }, 1800);
            });
        }

            const wrapper = btn.closest('.assistant-content-wrapper');
            const bubble = wrapper.querySelector('.assistant-bubble');
            speakText(bubble.innerText);

        // ─── Real-time Streaming Send Message ───────────────────────────────
        async function sendMessage() {
            const input = document.getElementById('userInput');
            const sendBtn = document.getElementById('sendBtn');
            const content = input.value.trim();

            if (!content) return;

            // Stop any playing audio
            if (currentAudio) {
                currentAudio.pause();
                currentAudio = null;
            }
            if (window.speechSynthesis) {
                window.speechSynthesis.cancel();
            }

            isStreaming = true;
            messages.push({ role: 'user', content });
            appendMessageNode('user', content);

            input.value = '';
            input.style.height = 'auto';
            sendBtn.classList.remove('active');
            sendBtn.disabled = true;

            saveToLocalStorage();

            const statusDot = document.getElementById('statusDot');
            if (statusDot) statusDot.classList.add('loading');
            showTypingIndicator();

            try {
                const res = await fetch('/chat/stream', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        prompt: content,
                        session_id: currentChatId
                    })
                });

                if (!res.ok) {
                    const err = await res.json().catch(() => ({ error: 'Server error' }));
                    removeTypingIndicator();
                    appendMessageNode('assistant', 'Error: ' + (err.error || res.statusText));
                    messages.pop();
                } else {
                    const reader = res.body.getReader();
                    const decoder = new TextDecoder();
                    let fullText = '';
                    let assistantRow = null;
                    let bubble = null;
                    let firstChunk = true;

                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;

                        const chunk = decoder.decode(value, { stream: true });
                        fullText += chunk;

                        if (firstChunk && fullText.trim().length > 0) {
                            firstChunk = false;
                            removeTypingIndicator();

                            assistantRow = appendMessageNode('assistant', '', false);
                            bubble = assistantRow.querySelector('.assistant-bubble');
                        }

                        if (bubble) {
                            bubble.innerHTML = renderMarkdown(fullText) + '<span class="gemini-stream-cursor"></span>';
                            scrollToBottom();
                        }
                    }

                    removeTypingIndicator();
                    if (bubble) {
                        bubble.innerHTML = renderMarkdown(fullText);
                    } else if (fullText.trim().length > 0) {
                        appendMessageNode('assistant', fullText, true);
                    }

                    if (fullText.trim().length > 0) {
                        messages.push({ role: 'assistant', content: fullText, sources: [] });
                        saveToLocalStorage();
                        speakText(fullText);
                    }
                }
            } catch (e) {
                console.error("Chat error:", e);
                removeTypingIndicator();
                appendMessageNode('assistant', '⚠️ ከአገልጋዩ ጋር መገናኘት አልተቻለም። እባክዎ እንደገና ይሞክሩ።');
                messages.pop();
            } finally {
                isStreaming = false;
                input.focus();
                if (statusDot) statusDot.classList.remove('loading');
                if (autoListenMode && !ttsEnabled && !isListening) {
                    setTimeout(() => {
                        if (autoListenMode && !isListening && !isStreaming) {
                            toggleSpeechRecognition();
                        }
                    }, 500);
                }
            }
        }

        // ─── Ethio-ASR Speech-to-Text & VAD ─────────────────────────────────
        let mediaRecorder = null;
        let audioChunks = [];
        let audioContext = null;
        let vadAnalyser = null;
        let vadAnimationId = null;
        let recordingTimeoutId = null;
        let silenceStartTime = null;
        let speechHasStarted = false;
        let webSpeechRec = null;

        const VAD_SILENCE_THRESHOLD = 0.006;
        const VAD_SILENCE_DURATION_MS = 1800;
        const MAX_RECORDING_MS = 25000;

        function getSupportedAudioMimeType() {
            const candidates = [
                'audio/webm;codecs=opus',
                'audio/webm',
                'audio/ogg;codecs=opus',
                'audio/ogg',
                'audio/mp4',
                'audio/aac',
                'audio/wav'
            ];
            if (typeof MediaRecorder === 'undefined' || !MediaRecorder.isTypeSupported) return '';
            for (const type of candidates) {
                if (MediaRecorder.isTypeSupported(type)) {
                    return type;
                }
            }
            return '';
        }

        function initSpeechRecognition() {
            const micBtn = document.getElementById("micBtn");
            if (micBtn) {
                micBtn.title = "ድምፅ ማዳመጫ / ንግግር ወደ ጽሑፍ (Ethio-ASR)";
            }

            // Automatically stop recording if user switches away from the tab
            document.addEventListener('visibilitychange', () => {
                if (document.hidden && isListening) {
                    if (mediaRecorder && mediaRecorder.state === "recording") {
                        try { mediaRecorder.requestData(); } catch (e) { }
                        mediaRecorder.stop();
                    }
                    stopVAD();
                }
            });
        }

        function stopVAD() {
            if (recordingTimeoutId) {
                clearTimeout(recordingTimeoutId);
                recordingTimeoutId = null;
            }
            if (vadAnimationId) {
                cancelAnimationFrame(vadAnimationId);
                vadAnimationId = null;
            }
            if (audioContext && audioContext.state !== "closed") {
                audioContext.close().catch(() => { });
                audioContext = null;
            }
            speechHasStarted = false;
            silenceStartTime = null;
        }

        async function startVAD(stream) {
            try {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                if (audioContext.state === 'suspended') {
                    await audioContext.resume();
                }
                const source = audioContext.createMediaStreamSource(stream);
                vadAnalyser = audioContext.createAnalyser();
                vadAnalyser.fftSize = 512;
                source.connect(vadAnalyser);

                const pcmData = new Uint8Array(vadAnalyser.fftSize);
                const recordingStartTime = Date.now();

                function monitorVAD() {
                    if (!isListening) return;

                    vadAnalyser.getByteTimeDomainData(pcmData);
                    let sum = 0;
                    for (let i = 0; i < pcmData.length; i++) {
                        const val = (pcmData[i] - 128) / 128.0;
                        sum += val * val;
                    }
                    const rms = Math.sqrt(sum / pcmData.length);
                    const now = Date.now();

                    if (rms > VAD_SILENCE_THRESHOLD) {
                        if (!speechHasStarted) {
                            speechHasStarted = true;
                            const input = document.getElementById("userInput");
                            if (input) input.placeholder = "ድምፅ ተገኝቷል... (እያዳመጥኩ ነው)";
                        }
                        silenceStartTime = null;
                    } else if (speechHasStarted) {
                        if (!silenceStartTime) {
                            silenceStartTime = now;
                        } else if (now - silenceStartTime >= VAD_SILENCE_DURATION_MS) {
                            const input = document.getElementById("userInput");
                            if (input) input.placeholder = "ድምፅ አቁሟል — ወደ ጽሑፍ በመቀየር ላይ...";
                            if (mediaRecorder && mediaRecorder.state === "recording") {
                                try { mediaRecorder.requestData(); } catch (e) { }
                                mediaRecorder.stop();
                            }
                            stopVAD();
                            return;
                        }
                    }

                    if (now - recordingStartTime >= MAX_RECORDING_MS) {
                        if (mediaRecorder && mediaRecorder.state === "recording") {
                            try { mediaRecorder.requestData(); } catch (e) { }
                            mediaRecorder.stop();
                        }
                        stopVAD();
                        return;
                    }

                    vadAnimationId = requestAnimationFrame(monitorVAD);
                }

                vadAnimationId = requestAnimationFrame(monitorVAD);
            } catch (e) {
                console.warn("[VAD] Web Audio VAD note:", e);
            }
        }

        function startWebSpeechFallback() {
            const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRec) {
                appendMessageNode('assistant', '⚠️ ማይክሮፎን ደህንነቱ በተጠበቀ ግንኙነት (HTTPS) ወይም በ `http://localhost:5000` / `http://127.0.0.1:5000` ብቻ ነው የሚሰራው። እባክዎ በ localhost ይክፈቱ ወይም HTTPS ይጠቀሙ።');
                return;
            }

            if (isListening && webSpeechRec) {
                try { webSpeechRec.stop(); } catch (e) { }
                isListening = false;
                const micBtn = document.getElementById("micBtn");
                if (micBtn) micBtn.classList.remove("listening");
                return;
            }

            try {
                webSpeechRec = new SpeechRec();
                webSpeechRec.lang = 'am-ET';
                webSpeechRec.continuous = false;
                webSpeechRec.interimResults = true;

                const micBtn = document.getElementById("micBtn");
                const input = document.getElementById("userInput");

                webSpeechRec.onstart = () => {
                    isListening = true;
                    if (micBtn) micBtn.classList.add("listening");
                    if (input) input.placeholder = "እያዳመጥኩ ነው... (ሲያቆሙ በራሱ ይልካል)";
                };

                webSpeechRec.onresult = (event) => {
                    let transcript = '';
                    for (let i = event.resultIndex; i < event.results.length; ++i) {
                        transcript += event.results[i][0].transcript;
                    }
                    if (transcript && input) {
                        input.value = transcript;
                        handleInput(input);
                    }
                };

                webSpeechRec.onend = () => {
                    isListening = false;
                    if (micBtn) micBtn.classList.remove("listening");
                    if (input) {
                        input.placeholder = "መልዕክትዎን እዚህ ይጻፉ...";
                        if (input.value && input.value.trim().length > 0) {
                            sendMessage();
                        }
                    }
                };

                webSpeechRec.onerror = (e) => {
                    console.warn("Web Speech error:", e);
                    isListening = false;
                    if (micBtn) micBtn.classList.remove("listening");
                    if (input) input.placeholder = "መልዕክትዎን እዚህ ይጻፉ...";
                    if (e.error === 'not-allowed') {
                        appendMessageNode('assistant', '⚠️ የማይክሮፎን ፈቃድ ተከልክሏል። እባክዎ በብሮውዘርዎ ውስጥ ፈቃድ ይስጡ (Allow Microphone)።');
                    }
                };

                webSpeechRec.start();
            } catch (err) {
                console.error("WebSpeech start failed:", err);
                appendMessageNode('assistant', '⚠️ ማይክሮፎን መክፈት አልተቻለም። እባክዎ በ HTTPS ወይም localhost ይሞክሩ።');
            }
        }

        // ─── Hands-Free Continuous Voice Mode ─────────────────────────────────
        function toggleAutoListen() {
            autoListenMode = !autoListenMode;
            const btn = document.getElementById("autoListenBtn");
            const label = document.getElementById("autoListenText");
            if (btn) {
                if (autoListenMode) {
                    btn.classList.add("active");
                    btn.title = "ቀጣይነት ያለው ውይይት (በርቷል - ራስ-ሰር ያዳምጣል)";
                    if (label) label.textContent = "Auto-Listen (ON)";
                    if (!isListening && !isStreaming) {
                        toggleSpeechRecognition();
                    }
                } else {
                    btn.classList.remove("active");
                    btn.title = "ቀጣይነት ያለው ውይይት (ጠፍቷል)";
                    if (label) label.textContent = "Auto-Listen";
                    if (isListening) {
                        toggleSpeechRecognition();
                    }
                }
            }
        }

        async function toggleSpeechRecognition() {
            const micBtn = document.getElementById("micBtn");
            const input = document.getElementById("userInput");

            if (isListening) {
                stopVAD();
                if (mediaRecorder && mediaRecorder.state === "recording") {
                    try { mediaRecorder.requestData(); } catch (e) { }
                    mediaRecorder.stop();
                }
                if (webSpeechRec) {
                    try { webSpeechRec.stop(); } catch (e) { }
                }
                return;
            }

            // Automatically turn on continuous auto-listen mode when mic is activated
            if (!autoListenMode) {
                autoListenMode = true;
                const autoBtn = document.getElementById("autoListenBtn");
                const autoLabel = document.getElementById("autoListenText");
                if (autoBtn) {
                    autoBtn.classList.add("active");
                    autoBtn.title = "ቀጣይነት ያለው ውይይት (በርቷል - ራስ-ሰር ያዳምጣል)";
                    if (autoLabel) autoLabel.textContent = "Auto-Listen (ON)";
                }
            }

            const getUserMedia = (navigator.mediaDevices && navigator.mediaDevices.getUserMedia)
                ? navigator.mediaDevices.getUserMedia.bind(navigator.mediaDevices)
                : (navigator.getUserMedia || navigator.webkitGetUserMedia || navigator.mozGetUserMedia);

            if (!getUserMedia) {
                if (window.webkitSpeechRecognition || window.SpeechRecognition) {
                    startWebSpeechFallback();
                    return;
                }
                appendMessageNode('assistant', '⚠️ ማይክሮፎን ደህንነቱ በተጠበቀ ገጽ (HTTPS) ወይም በ `http://localhost:5000` / `http://127.0.0.1:5000` ብቻ ነው የሚሰራው። እባክዎ በ localhost ይክፈቱ ወይም HTTPS ይጠቀሙ።');
                return;
            }

            let stream;
            try {
                stream = await getUserMedia({
                    audio: {
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true
                    }
                });
            } catch (firstErr) {
                try {
                    stream = await getUserMedia({ audio: true });
                } catch (e) {
                    console.error("Microphone access failed:", e);
                    if (e.name === 'NotAllowedError' || e.name === 'PermissionDeniedError') {
                        appendMessageNode('assistant', '⚠️ የማይክሮፎን ፈቃድ ተከልክሏል። እባክዎ በብሮውዘርዎ አድራሻ አሞሌ (Address Bar) ላይ ያለውን የማይክሮፎን ምልክት በመጫን ፈቃድ ይስጡ (Allow Microphone)።');
                    } else if (e.name === 'NotFoundError' || e.name === 'DevicesNotFoundError') {
                        appendMessageNode('assistant', '⚠️ ምንም የተገናኘ ማይክሮፎን አልተገኘም። እባክዎ ማይክሮፎንዎን ያገናኙ።');
                    } else {
                        if (window.webkitSpeechRecognition || window.SpeechRecognition) {
                            startWebSpeechFallback();
                            return;
                        }
                        appendMessageNode('assistant', '⚠️ የማይክሮፎን ፈቃድ አልተገኘም። እባክዎ በብሮውዘርዎ ማይክሮፎን ይፍቀዱ ወይም በ `http://localhost:5000` ይክፈቱ።');
                    }
                    return;
                }
            }

            isListening = true;
            audioChunks = [];
            if (micBtn) {
                micBtn.classList.add("listening");
                micBtn.title = "ድምፅ በመቅረጽ ላይ... ለማቆም እና ለመላክ ይጫኑ";
            }
            if (input) {
                input.placeholder = "🎙️ እያዳመጥኩ ነው... (ለመላክ እዚህ ወይም ማይክሮፎኑን ይጫኑ)";
            }

            const supportedMime = getSupportedAudioMimeType();
            const recorderOptions = supportedMime ? { mimeType: supportedMime } : {};

            try {
                mediaRecorder = new MediaRecorder(stream, recorderOptions);
            } catch (recErr) {
                console.warn("MediaRecorder init with options fallback:", recErr);
                try {
                    mediaRecorder = new MediaRecorder(stream);
                } catch (recErr2) {
                    console.error("MediaRecorder failed entirely, falling back to Web Speech:", recErr2);
                    stream.getTracks().forEach(t => t.stop());
                    isListening = false;
                    if (micBtn) micBtn.classList.remove("listening");
                    startWebSpeechFallback();
                    return;
                }
            }

            mediaRecorder.ondataavailable = (e) => {
                if (e.data && e.data.size > 0) audioChunks.push(e.data);
            };

            mediaRecorder.onstop = async () => {
                stopVAD();
                stream.getTracks().forEach(t => t.stop());
                isListening = false;
                if (micBtn) {
                    micBtn.classList.remove("listening");
                    micBtn.title = "ድምፅ ማዳመጫ / ንግግር ወደ ጽሑፍ (Ethio-ASR)";
                }
                if (input) input.placeholder = "በEthio-ASR ወደ አማርኛ ጽሑፍ በመቀየር ላይ...";

                if (audioChunks.length === 0) {
                    if (input) input.placeholder = "መልዕክትዎን እዚህ ይጻፉ...";
                    return;
                }

                const finalMime = mediaRecorder.mimeType || supportedMime || 'audio/webm';
                const audioBlob = new Blob(audioChunks, { type: finalMime });

                try {
                    const res = await fetch("/api/stt", {
                        method: "POST",
                        headers: { "Content-Type": finalMime },
                        body: audioBlob
                    });
                    const data = await res.json();
                    if (data.transcript && data.transcript.trim().length > 0) {
                        if (input) {
                            input.value = data.transcript;
                            input.placeholder = "መልዕክትዎን እዚህ ይጻፉ...";
                            handleInput(input);
                            sendMessage();
                        }
                    } else {
                        if (input) {
                            input.placeholder = "ምንም ድምፅ አልተሰማም። እባክዎ እንደገና ይሞክሩ።";
                            setTimeout(() => {
                                input.placeholder = "መልዕክትዎን እዚህ ይጻፉ...";
                            }, 2500);
                        }
                    }
                } catch (e) {
                    console.error("STT error:", e);
                    if (input) input.placeholder = "መልዕክትዎን እዚህ ይጻፉ...";
                }
            };

            if (recordingTimeoutId) {
                clearTimeout(recordingTimeoutId);
            }
            recordingTimeoutId = setTimeout(() => {
                if (mediaRecorder && mediaRecorder.state === "recording") {
                    try { mediaRecorder.requestData(); } catch (e) { }
                    mediaRecorder.stop();
                }
                stopVAD();
            }, MAX_RECORDING_MS);

            mediaRecorder.start(200);
            startVAD(stream);
        }



        // ─── Speech Synthesis (TTS) ────────────────────────────────────────
        function toggleTTS() {
            ttsEnabled = !ttsEnabled;
            const btn = document.getElementById("speakerBtn");
            if (btn) {
                if (ttsEnabled) {
                    btn.classList.add("active");
                    btn.title = "ድምፅ ማብሪያ/ማጥፊያ (በርቷል)";
                } else {
                    btn.classList.remove("active");
                    btn.title = "ድምፅ ማብሪያ/ማጥፊያ (ጠፍቷል)";
                }
            }
            if (!ttsEnabled) {
                if (currentAudio) {
                    currentAudio.pause();
                    currentAudio = null;
                }
                if (window.speechSynthesis) {
                    window.speechSynthesis.cancel();
                }
            }
        }

        function speakText(text) {
            const triggerAutoListen = () => {
                if (autoListenMode && !isListening && !isStreaming) {
                    setTimeout(() => {
                        if (autoListenMode && !isListening && !isStreaming) {
                            toggleSpeechRecognition();
                        }
                    }, 400);
                }
            };

            if (!ttsEnabled || !text) {
                triggerAutoListen();
                return;
            }

            const cleanText = text.replace(/<[^>]*>/g, '')
                .replace(/\*\*|__/g, '')
                .replace(/\*|_/g, '')
                .replace(/`[^`]+`/g, '')
                .replace(/#+\s*/g, '')
                .trim();
            if (!cleanText) {
                triggerAutoListen();
                return;
            }

            if (currentAudio) {
                currentAudio.pause();
                currentAudio = null;
            }
            if (window.speechSynthesis) {
                window.speechSynthesis.cancel();
            }

            const audioUrl = `/api/tts/audio?text=${encodeURIComponent(cleanText)}&lang=am-ET`;
            const audio = new Audio(audioUrl);
            currentAudio = audio;

            audio.onended = () => {
                currentAudio = null;
                triggerAutoListen();
            };

            audio.onerror = () => {
                currentAudio = null;
                triggerAutoListen();
            };

            audio.play().catch(e => {
                console.warn("[TTS] Backend audio stream failed, fallback to browser SpeechSynthesis:", e);
                if ('speechSynthesis' in window) {
                    try { window.speechSynthesis.resume(); } catch (err) { }
                    const voices = window.speechSynthesis.getVoices();
                    let targetVoice = voices.find(v => v.name.includes('Mekdes') || v.lang.startsWith('am'));
                    const utterance = new SpeechSynthesisUtterance(cleanText);
                    utterance.lang = "am-ET";
                    if (targetVoice) utterance.voice = targetVoice;
                    utterance.onend = triggerAutoListen;
                    utterance.onerror = triggerAutoListen;
                    window.speechSynthesis.speak(utterance);
                } else {
                    triggerAutoListen();
                }
            });
        }

        init();
    </script>
</body>
