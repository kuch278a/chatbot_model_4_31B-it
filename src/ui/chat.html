<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Amani AI — Bilingual Amharic/English Conversational Assistant powered by Gemma 4 31B-it.">
    <title>Amani AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Inter:wght@400;500;600;700&family=Noto+Sans+Ethiopic:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
</head>

<body>
    <!-- Mobile sidebar overlay -->
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

    <div class="app-container">
        <!-- ─── Collapsible Sidebar ───────────────────────────────────────────── -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-top">
                <div class="sidebar-brand-row">
                    <div class="brand-group">
                        <div class="brand-icon">አ</div>
                        <span class="brand-text">Amani AI</span>
                    </div>
                    <button class="icon-button" onclick="toggleSidebar()" title="Collapse menu">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                            <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/>
                        </svg>
                    </button>
                </div>

                <button class="new-chat-pill" onclick="startNewChat()">
                    <svg viewBox="0 0 24 24">
                        <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
                    </svg>
                    <span>New chat</span>
                </button>
            </div>

            <div class="sidebar-section-title">Recent</div>
            <div class="chat-history-list" id="chatList">
                <!-- Injected chat history items -->
            </div>

            <!-- Knowledge Base Drawer -->
            <div class="sidebar-kb-section">
                <div class="sidebar-kb-header">
                    <span>Knowledge Base (RAG)</span>
                    <button class="kb-refresh-btn" onclick="refreshFiles()" title="Rescan local documents">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                            <path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
                        </svg>
                    </button>
                </div>
                <div class="kb-files-list" id="indexedFiles">
                    <div style="font-size:11px;color:var(--text-muted);text-align:center;padding:4px 0;">Loading documents...</div>
                </div>
            </div>
        </aside>

        <!-- ─── Main Chat Viewport ───────────────────────────────────────────── -->
        <main class="main-chat-viewport">
            <!-- Top Bar -->
            <header class="gemini-topbar">
                <div class="topbar-left">
                    <button class="icon-button" id="menuToggle" onclick="toggleSidebar()" title="Toggle sidebar">
                        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
                            <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/>
                        </svg>
                    </button>
                    <div class="model-badge">
                        <div class="model-dot" id="statusDot"></div>
                        <span>Gemma 4 31B-it</span>
                    </div>
                </div>

                <div class="topbar-right">
                    <select id="langSelect" class="pill-select" title="Language Selector">
                        <option value="en-US">English (en-US)</option>
                        <option value="am-ET" selected>አማርኛ (am-ET)</option>
                    </select>

                    <button id="speakerBtn" onclick="toggleTTS()" class="action-pill-btn active" title="Toggle Voice (TTS)">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                            <path d="M14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77zm-4 2.77L5 10H1v4h4l5 4V6zm3 6c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/>
                        </svg>
                        <span>Voice</span>
                    </button>

                    <button class="action-pill-btn" onclick="deleteCurrentChat()" title="Clear this chat">
                        <span>Clear</span>
                    </button>

                    <div class="user-avatar-circle" title="User">EA</div>
                </div>
            </header>

            <!-- Chat Scroll Area -->
            <div class="chat-scroll-container" id="chatScrollContainer">
                <div class="conversation-inner" id="messages">
                    <div class="welcome-hero" id="welcomeHero">
                        <div class="welcome-badge-icon">አ</div>
                        <h1 class="welcome-title">ሰላም፣ እንዴት ልርዳዎት?</h1>
                    </div>
                </div>
            </div>

            <!-- ─── Floating Input Capsule ──────────────────────────────────── -->
            <div class="floating-input-wrapper">
                <div class="input-capsule-box">
                    <textarea 
                        id="userInput" 
                        class="gemini-textarea" 
                        placeholder="ሰላም፣ እንዴት ልርዳዎት? መልዕክትዎን እዚህ ይጻፉ..." 
                        rows="1" 
                        onkeydown="handleKeyDown(event)" 
                        oninput="handleInput(this)"
                    ></textarea>

                    <div class="input-bottom-row">
                        <div class="input-tools-left">
                            <div class="rag-status-chip" title="Local RAG Semantic Search is active">
                                <svg viewBox="0 0 24 24" fill="currentColor">
                                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
                                </svg>
                                <span>RAG Active</span>
                            </div>
                        </div>

                        <div class="input-actions-right">
                            <!-- Mic Button with Ethio-ASR Voice Recognition -->
                            <button id="micBtn" onclick="toggleSpeechRecognition()" class="gemini-mic-btn" title="Click to record speech (English / Amharic)">
                                <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                                    <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5-3c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
                                </svg>
                            </button>

                            <!-- Send Button with Dynamic Active Glow -->
                            <button id="sendBtn" onclick="sendMessage()" class="gemini-send-btn" title="Send / ላክ" disabled>
                                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                                    <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>

                <div class="gemini-disclaimer-footer">
                    Amani AI may produce inaccurate information. Please verify important details.
                </div>
            </div>
        </main>
    </div>

    <!-- ─── Application JavaScript ───────────────────────────────────────────── -->
    <script>
        let messages = [];
        let chats = JSON.parse(localStorage.getItem('amani_chats') || '[]');
        let currentChatId = localStorage.getItem('amani_current_chat_id') || null;
        let isListening = false;
        let ttsEnabled = true;
        let currentAudio = null;

        // ─── Initializer ───────────────────────────────────────────────────
        function init() {
            if (!currentChatId || !chats.find(c => c.id === currentChatId)) {
                startNewChat(false);
            } else {
                loadChat(currentChatId);
            }
            renderChatList();
            loadFileList();
            initSpeechRecognition();

            if (window.speechSynthesis) {
                window.speechSynthesis.getVoices();
            }
        }

        // ─── Sidebar Toggle ────────────────────────────────────────────────
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            if (window.innerWidth <= 768) {
                sidebar.classList.toggle('open');
                overlay.classList.toggle('active');
            } else {
                sidebar.classList.toggle('collapsed');
            }
        }

        // ─── Chat Management ───────────────────────────────────────────────
        function startNewChat(shouldConfirm = true) {
            if (shouldConfirm && messages.length > 0) {
                if (!confirm("አዲስ ውይይት መጀመር ይፈልጋሉ?")) return;
            }

            const newId = Date.now().toString();
            fetch('/clear', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ session_id: newId })
            }).catch(() => {});

            const newChat = {
                id: newId,
                title: 'New Chat',
                messages: [],
                timestamp: Date.now()
            };

            chats.unshift(newChat);
            currentChatId = newId;
            messages = [];

            saveToLocalStorage();
            renderChatList();
            displayMessages();
        }

        function loadChat(id) {
            const chat = chats.find(c => c.id === id);
            if (chat) {
                currentChatId = id;
                messages = chat.messages || [];
                displayMessages();
                renderChatList();
                saveToLocalStorage();

                if (window.innerWidth <= 768) {
                    document.getElementById('sidebar').classList.remove('open');
                    document.getElementById('sidebarOverlay').classList.remove('active');
                }
            }
        }

        function saveToLocalStorage() {
            const chat = chats.find(c => c.id === currentChatId);
            if (chat) {
                chat.messages = JSON.parse(JSON.stringify(messages));
                chat.timestamp = Date.now();
                if (chat.title === 'New Chat' && messages.length > 0) {
                    let firstMsg = messages[0].content;
                    if (firstMsg.length > 28) {
                        const truncated = firstMsg.substring(0, 28);
                        const lastSpace = truncated.lastIndexOf(' ');
                        chat.title = (lastSpace > 10 ? truncated.substring(0, lastSpace) : truncated) + '...';
                    } else {
                        chat.title = firstMsg;
                    }
                }
            }
            localStorage.setItem('amani_chats', JSON.stringify(chats));
            localStorage.setItem('amani_current_chat_id', currentChatId);
            renderChatList();
        }

        function renderChatList() {
            const list = document.getElementById('chatList');
            list.innerHTML = '';

            chats.forEach(chat => {
                const div = document.createElement('div');
                div.className = `chat-history-item ${chat.id === currentChatId ? 'active' : ''}`;
                div.onclick = () => loadChat(chat.id);

                div.innerHTML = `
                    <div class="chat-item-title-wrapper">
                        <svg viewBox="0 0 24 24" fill="currentColor">
                            <path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 9h12v2H6V9zm8 5H6v-2h8v2zm4-6H6V6h12v2z"/>
                        </svg>
                        <span class="chat-item-title-text">${escapeHtml(chat.title)}</span>
                    </div>
                    <button class="chat-item-delete" onclick="event.stopPropagation(); deleteChat('${chat.id}')" title="Delete chat">
                        <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor">
                            <path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/>
                        </svg>
                    </button>
                `;
                list.appendChild(div);
            });
        }

        function deleteChat(id) {
            if (!confirm("ይህንን ውይይት መሰረዝ እርግጠኛ ነዎት?")) return;

            fetch('/clear', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ session_id: id })
            }).catch(() => {});

            chats = chats.filter(c => c.id !== id);
            if (currentChatId === id) {
                if (chats.length > 0) {
                    loadChat(chats[0].id);
                } else {
                    startNewChat(false);
                }
            }
            saveToLocalStorage();
            renderChatList();
        }

        function deleteCurrentChat() {
            deleteChat(currentChatId);
        }

        // ─── Welcome Landing Hero ──────────────────────────────────────────
        function getWelcomeHtml() {
            return `
                <div class="welcome-hero" id="welcomeHero">
                    <div class="welcome-badge-icon">አ</div>
                    <h1 class="welcome-title">ሰላም፣ እንዴት ልርዳዎት?</h1>
                </div>
            `;
        }

        // ─── Display Messages ──────────────────────────────────────────────
        function displayMessages() {
            const container = document.getElementById('messages');
            container.innerHTML = '';

            if (messages.length === 0) {
                container.innerHTML = getWelcomeHtml();
                return;
            }

            messages.forEach(msg => {
                appendMessageNode(msg.role, msg.content, false, msg.sources);
            });

            scrollToBottom();
        }

        // ─── Input Handling ────────────────────────────────────────────────
        function handleKeyDown(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        function handleInput(el) {
            el.style.height = 'auto';
            el.style.height = Math.min(el.scrollHeight, 160) + 'px';

            const sendBtn = document.getElementById('sendBtn');
            if (el.value.trim().length > 0) {
                sendBtn.classList.add('active');
                sendBtn.disabled = false;
            } else {
                sendBtn.classList.remove('active');
                sendBtn.disabled = true;
            }
        }

        function scrollToBottom() {
            const scrollContainer = document.getElementById('chatScrollContainer');
            scrollContainer.scrollTop = scrollContainer.scrollHeight;
        }

        // ─── Typing Indicator ──────────────────────────────────────────────
        function showTypingIndicator() {
            const container = document.getElementById('messages');

            const indicator = document.createElement('div');
            indicator.className = 'message-row assistant';
            indicator.id = 'typingIndicator';
            indicator.innerHTML = `
                <div class="avatar-assistant">
                    <div class="avatar-badge">አ</div>
                </div>
                <div class="assistant-content-wrapper">
                    <div class="gemini-typing-indicator">
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                    </div>
                </div>
            `;
            container.appendChild(indicator);
            scrollToBottom();
        }

        function removeTypingIndicator() {
            const indicator = document.getElementById('typingIndicator');
            if (indicator) indicator.remove();
        }

        // ─── Markdown Parser ───────────────────────────────────────────────
        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return (text || '').replace(/[&<>"']/g, m => map[m]);
        }

        function renderMarkdown(text) {
            let html = escapeHtml(text);

            // Code blocks
            html = html.replace(/```([a-zA-Z0-9_-]*)\n([\s\S]*?)```/g, (match, lang, code) => {
                return `<pre><code class="language-${lang}">${code}</code></pre>`;
            });

            // Inline code
            html = html.replace(/`([^`]+)`/g, '<code>$1</code>');

            // Bold & Italics
            html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
            html = html.replace(/\*([^*]+)\*/g, '<em>$1</em>');

            // Unordered list items
            html = html.replace(/^[\-\*]\s+(.+)$/gm, '<li>$1</li>');
            html = html.replace(/((?:<li>.*<\/li>\n?)+)/g, '<ul>$1</ul>');

            // Ordered list items
            html = html.replace(/^\d+\.\s+(.+)$/gm, '<li>$1</li>');
            html = html.replace(/((?:<li>.*<\/li>\n?)+)/g, function(match) {
                if (match.startsWith('<ul>')) return match;
                return '<ol>' + match + '</ol>';
            });

            // Paragraphs and Line breaks
            html = html.replace(/\n\n+/g, '</p><p>');
            html = html.replace(/\n/g, '<br>');
            html = '<p>' + html + '</p>';
            html = html.replace(/<p>\s*<\/p>/g, '');

            return html;
        }

        // ─── Message Node Creation ─────────────────────────────────────────
        function appendMessageNode(role, content, scroll = true, sources = null) {
            const container = document.getElementById('messages');
            const welcomeHero = document.getElementById('welcomeHero');
            if (welcomeHero) {
                welcomeHero.remove();
            }

            const row = document.createElement('div');
            row.className = `message-row ${role}`;

            if (role === 'user') {
                row.innerHTML = `
                    <div class="user-bubble">${escapeHtml(content)}</div>
                `;
            } else {
                let sourcesHtml = '';
                if (sources && sources.length > 0) {
                    let chunkItems = sources.map(s => `
                        <div class="source-chunk-card">
                            <strong>${escapeHtml(s.document_name)}</strong> (Match: ${(s.score * 100).toFixed(1)}%)<br>
                            ${escapeHtml(s.text)}
                        </div>
                    `).join('');

                    sourcesHtml = `
                        <div class="sources-pill-accordion">
                            <div class="sources-pill-toggle" onclick="this.nextElementSibling.classList.toggle('open')">
                                <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H8V4h12v12z"/></svg>
                                <span>📚 ${sources.length} Retrieved Source(s)</span>
                            </div>
                            <div class="sources-body">${chunkItems}</div>
                        </div>
                    `;
                }

                row.innerHTML = `
                    <div class="avatar-assistant">
                        <div class="avatar-badge">አ</div>
                    </div>
                    <div class="assistant-content-wrapper">
                        <div class="assistant-bubble">${renderMarkdown(content)}</div>
                        ${sourcesHtml}
                        <div class="message-actions-toolbar">
                            <button class="action-icon-btn" onclick="copyMessageText(this)" title="Copy to clipboard">
                                <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
                            </button>
                            <button class="action-icon-btn" onclick="speakSingleMessage(this)" title="Read Aloud (TTS)">
                                <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                            </button>
                        </div>
                    </div>
                `;
            }

            container.appendChild(row);
            if (scroll) scrollToBottom();
            return row;
        }

        function copyMessageText(btn) {
            const wrapper = btn.closest('.assistant-content-wrapper');
            const bubble = wrapper.querySelector('.assistant-bubble');
            const text = bubble.innerText;

            navigator.clipboard.writeText(text).then(() => {
                const originalHtml = btn.innerHTML;
                btn.innerHTML = `<span style="font-size:11px;color:var(--gemini-emerald);">✓ Copied</span>`;
                setTimeout(() => { btn.innerHTML = originalHtml; }, 1800);
            });
        }

        function speakSingleMessage(btn) {
            const wrapper = btn.closest('.assistant-content-wrapper');
            const bubble = wrapper.querySelector('.assistant-bubble');
            speakText(bubble.innerText);
        }

        // ─── Real-time Streaming Send Message ───────────────────────────────
        async function sendMessage() {
            const input = document.getElementById('userInput');
            const sendBtn = document.getElementById('sendBtn');
            const content = input.value.trim();

            if (!content) return;

            // Stop any playing audio
            if (currentAudio) {
                currentAudio.pause();
                currentAudio = null;
            }
            if (window.speechSynthesis) {
                window.speechSynthesis.cancel();
            }

            messages.push({ role: 'user', content });
            appendMessageNode('user', content);

            input.value = '';
            input.style.height = 'auto';
            sendBtn.classList.remove('active');
            sendBtn.disabled = true;

            saveToLocalStorage();

            const statusDot = document.getElementById('statusDot');
            statusDot.classList.add('loading');
            showTypingIndicator();

            try {
                const res = await fetch('/chat/stream', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        prompt: content,
                        session_id: currentChatId
                    })
                });

                if (!res.ok) {
                    const err = await res.json().catch(() => ({ error: 'Server error' }));
                    removeTypingIndicator();
                    appendMessageNode('assistant', 'Error: ' + (err.error || res.statusText));
                    messages.pop();
                } else {
                    const reader = res.body.getReader();
                    const decoder = new TextDecoder();
                    let fullText = '';
                    let assistantRow = null;
                    let bubble = null;
                    let firstChunk = true;

                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;

                        const chunk = decoder.decode(value, { stream: true });
                        fullText += chunk;

                        if (firstChunk && fullText.trim().length > 0) {
                            firstChunk = false;
                            removeTypingIndicator();

                            assistantRow = appendMessageNode('assistant', '', false);
                            bubble = assistantRow.querySelector('.assistant-bubble');
                        }

                        if (bubble) {
                            bubble.innerHTML = renderMarkdown(fullText) + '<span class="gemini-stream-cursor"></span>';
                            scrollToBottom();
                        }
                    }

                    removeTypingIndicator();
                    if (bubble) {
                        bubble.innerHTML = renderMarkdown(fullText);
                    } else if (fullText.trim().length > 0) {
                        appendMessageNode('assistant', fullText, true);
                    }

                    if (fullText.trim().length > 0) {
                        messages.push({ role: 'assistant', content: fullText, sources: [] });
                        saveToLocalStorage();
                        speakText(fullText);
                    }
                }
            } catch (e) {
                removeTypingIndicator();
                appendMessageNode('assistant', '⚠️ ከአገልጋዩ ጋር መገናኘት አልተቻለም። እባክዎ እንደገና ይሞክሩ።');
                messages.pop();
            }

            input.focus();
            statusDot.classList.remove('loading');
        }

        // ─── File Indexing (RAG) ───────────────────────────────────────────
        async function loadFileList() {
            try {
                const res = await fetch('/files');
                const data = await res.json();
                const container = document.getElementById('indexedFiles');
                if (container) {
                    container.innerHTML = '';
                    if (data.files && data.files.length > 0) {
                        data.files.forEach(name => {
                            const div = document.createElement('div');
                            div.className = 'kb-file-pill';
                            div.innerHTML = `<span>✓</span> ${escapeHtml(name)}`;
                            container.appendChild(div);
                        });
                    } else {
                        container.innerHTML = '<div style="font-size:11px;color:var(--text-muted);text-align:center;">No files indexed</div>';
                    }
                }
            } catch (e) {
                console.error("Failed to load file list");
            }
        }

        async function refreshFiles() {
            const statusDot = document.getElementById('statusDot');
            statusDot.classList.add('loading');
            try {
                await fetch('/refresh', { method: 'POST' });
                await loadFileList();
                appendMessageNode('assistant', '✓ የመረጃ ቋት ሰነዶች በተሳካ ሁኔታ ታድሰዋል!');
            } catch (e) {
                appendMessageNode('assistant', '⚠️ የመረጃ ቋት ሰነዶችን ማደስ አልተቻለም።');
            } finally {
                statusDot.classList.remove('loading');
            }
        }

        // ─── Ethio-ASR Speech-to-Text & VAD ─────────────────────────────────
        let mediaRecorder = null;
        let audioChunks = [];
        let audioContext = null;
        let vadAnalyser = null;
        let vadAnimationId = null;
        let silenceStartTime = null;
        let speechHasStarted = false;

        const VAD_SILENCE_THRESHOLD = 0.015;
        const VAD_SILENCE_DURATION_MS = 1200;
        const MAX_RECORDING_MS = 15000;

        function initSpeechRecognition() {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                document.getElementById("micBtn").style.display = "none";
            }
        }

        function stopVAD() {
            if (vadAnimationId) {
                cancelAnimationFrame(vadAnimationId);
                vadAnimationId = null;
            }
            if (audioContext && audioContext.state !== "closed") {
                audioContext.close().catch(() => {});
                audioContext = null;
            }
            speechHasStarted = false;
            silenceStartTime = null;
        }

        async function startVAD(stream) {
            try {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const source = audioContext.createMediaStreamSource(stream);
                vadAnalyser = audioContext.createAnalyser();
                vadAnalyser.fftSize = 512;
                source.connect(vadAnalyser);

                const pcmData = new Float32Array(vadAnalyser.fftSize);
                const recordingStartTime = Date.now();

                function monitorVAD() {
                    if (!isListening) return;

                    vadAnalyser.getFloatTimeDomainData(pcmData);
                    let sum = 0;
                    for (let i = 0; i < pcmData.length; i++) {
                        sum += pcmData[i] * pcmData[i];
                    }
                    const rms = Math.sqrt(sum / pcmData.length);
                    const now = Date.now();

                    if (rms > VAD_SILENCE_THRESHOLD) {
                        if (!speechHasStarted) {
                            speechHasStarted = true;
                            document.getElementById("userInput").placeholder = "ድምፅ ተገኝቷል... (እያዳመጥኩ ነው)";
                        }
                        silenceStartTime = null;
                    } else if (speechHasStarted) {
                        if (!silenceStartTime) {
                            silenceStartTime = now;
                        } else if (now - silenceStartTime >= VAD_SILENCE_DURATION_MS) {
                            document.getElementById("userInput").placeholder = "ድምፅ አቁሟል — ወደ ጽሑፍ በመቀየር ላይ...";
                            if (mediaRecorder && mediaRecorder.state !== "inactive") {
                                mediaRecorder.stop();
                            }
                            stopVAD();
                            return;
                        }
                    }

                    if (now - recordingStartTime >= MAX_RECORDING_MS) {
                        if (mediaRecorder && mediaRecorder.state !== "inactive") {
                            mediaRecorder.stop();
                        }
                        stopVAD();
                        return;
                    }

                    vadAnimationId = requestAnimationFrame(monitorVAD);
                }

                vadAnimationId = requestAnimationFrame(monitorVAD);
            } catch (e) {
                console.warn("[VAD] Could not initialize Web Audio VAD:", e);
            }
        }

        async function toggleSpeechRecognition() {
            if (isListening) {
                stopVAD();
                if (mediaRecorder && mediaRecorder.state !== "inactive") {
                    mediaRecorder.stop();
                }
                return;
            }

            let stream;
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true,
                        sampleRate: 16000,
                        channelCount: 1
                    }
                });
            } catch (e) {
                appendMessageNode('assistant', '⚠️ የማይክሮፎን ፈቃድ አልተገኘም። እባክዎ በብሮውዘርዎ ማይክሮፎን ይፍቀዱ።');
                return;
            }

            isListening = true;
            audioChunks = [];
            const micBtn = document.getElementById("micBtn");
            micBtn.classList.add("listening");
            const input = document.getElementById("userInput");
            input.placeholder = "እያዳመጥኩ ነው... (ሲያቆሙ በራሱ ይልካል)";

            mediaRecorder = new MediaRecorder(stream, { mimeType: "audio/webm" });

            mediaRecorder.ondataavailable = (e) => {
                if (e.data.size > 0) audioChunks.push(e.data);
            };

            mediaRecorder.onstop = async () => {
                stopVAD();
                stream.getTracks().forEach(t => t.stop());
                isListening = false;
                micBtn.classList.remove("listening");
                input.placeholder = "በEthio-ASR ወደ አማርኛ ጽሑፍ በመቀየር ላይ...";

                if (audioChunks.length === 0) {
                    input.placeholder = "መልዕክትዎን እዚህ ይጻፉ...";
                    return;
                }

                const audioBlob = new Blob(audioChunks, { type: "audio/webm" });
                try {
                    const res = await fetch("/api/stt", {
                        method: "POST",
                        headers: { "Content-Type": "audio/webm" },
                        body: audioBlob
                    });
                    const data = await res.json();
                    if (data.transcript && data.transcript.trim().length > 0) {
                        input.value = data.transcript;
                        input.placeholder = "መልዕክትዎን እዚህ ይጻፉ...";
                        handleInput(input);
                        sendMessage();
                    } else {
                        input.placeholder = "ምንም ድምፅ አልተሰማም። እባክዎ እንደገና ይሞክሩ።";
                        setTimeout(() => {
                            input.placeholder = "መልዕክትዎን እዚህ ይጻፉ...";
                        }, 2000);
                    }
                } catch (e) {
                    console.error("STT error:", e);
                    input.placeholder = "መልዕክትዎን እዚህ ይጻፉ...";
                }
            };

            mediaRecorder.start(200);
            startVAD(stream);
        }

        // ─── Speech Synthesis (TTS) ────────────────────────────────────────
        function toggleTTS() {
            ttsEnabled = !ttsEnabled;
            const btn = document.getElementById("speakerBtn");
            if (ttsEnabled) {
                btn.classList.add("active");
                btn.title = "ድምፅ ማብሪያ/ማጥፊያ (በርቷል)";
            } else {
                btn.classList.remove("active");
                btn.title = "ድምፅ ማብሪያ/ማጥፊያ (ጠፍቷል)";
                if (currentAudio) {
                    currentAudio.pause();
                    currentAudio = null;
                }
                if (window.speechSynthesis) {
                    window.speechSynthesis.cancel();
                }
            }
        }

        function speakText(text) {
            if (!ttsEnabled || !text) return;

            const cleanText = text.replace(/<[^>]*>/g, '')
                                  .replace(/\*\*|__/g, '')
                                  .replace(/\*|_/g, '')
                                  .replace(/`[^`]+`/g, '')
                                  .replace(/#+\s*/g, '')
                                  .trim();
            if (!cleanText) return;

            if (currentAudio) {
                currentAudio.pause();
                currentAudio = null;
            }
            if (window.speechSynthesis) {
                window.speechSynthesis.cancel();
            }

            const audioUrl = `/api/tts/audio?text=${encodeURIComponent(cleanText)}&lang=am-ET`;
            const audio = new Audio(audioUrl);
            currentAudio = audio;

            audio.play().catch(e => {
                console.warn("[TTS] Backend audio stream failed, fallback to browser SpeechSynthesis:", e);
                if ('speechSynthesis' in window) {
                    try { window.speechSynthesis.resume(); } catch (err) {}
                    const voices = window.speechSynthesis.getVoices();
                    let targetVoice = voices.find(v => v.name.includes('Mekdes') || v.lang.startsWith('am'));
                    const utterance = new SpeechSynthesisUtterance(cleanText);
                    utterance.lang = "am-ET";
                    if (targetVoice) utterance.voice = targetVoice;
                    window.speechSynthesis.speak(utterance);
                }
            });
        }

        init();
    </script>
